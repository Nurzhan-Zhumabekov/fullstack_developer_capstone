name: Lint and test
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:8.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/database/package-lock.json
            server/frontend/package-lock.json
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install JavaScript dependencies
        run: |
          npm ci --prefix server/database
          npm ci --prefix server/frontend
      - name: Lint React
        working-directory: server/frontend
        run: npm exec -- eslint src/
      - name: Lint Express
        run: >-
          server/frontend/node_modules/.bin/eslint --no-eslintrc --env node,es2022
          --rule 'no-undef:error' server/database/app.js server/database/dealership.js
          server/database/review.js server/database/test/
      - name: Install Python dependencies
        run: >
          python -m pip install -r server/requirements.txt
          -r server/djangoapp/microservices/requirements.txt ruff==0.17.5
      - name: Lint Python
        run: ruff check --isolated server
      - name: Test Express with MongoDB
        working-directory: server/database
        run: npm test
      - name: Test Django
        working-directory: server
        run: python manage.py test
      - name: Test React
        working-directory: server/frontend
        run: npm test -- --watchAll=false --runInBand
      - name: Test sentiment
        working-directory: server/djangoapp/microservices
        run: python -m unittest -v
      - name: Build React
        working-directory: server/frontend
        run: npm run build
