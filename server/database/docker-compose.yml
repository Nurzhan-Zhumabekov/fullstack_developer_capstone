services:
  mongo_db:
    image: mongo:8.0
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    environment:
      MONGODB_URI: mongodb://mongo_db:27017
    ports:
      - "127.0.0.1:3030:3030"
    depends_on:
      mongo_db:
        condition: service_healthy
volumes:
  mongo_data:
