apiVersion: v1
kind: ConfigMap
metadata:
  name: dealership-config
data:
  DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,preview.example.com"
  DJANGO_CSRF_TRUSTED_ORIGINS: "https://preview.example.com"
  DJANGO_SECURE_COOKIES: "1"
  DEALERS_API_URL: "http://catalog:3030"
  SENTIMENT_API_URL: "http://sentiment:5050"
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-mongo
spec:
  selector:
    app: dealership-mongo
  ports:
    - port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-mongo
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dealership-mongo
  template:
    metadata:
      labels:
        app: dealership-mongo
    spec:
      containers:
        - name: mongo
          image: mongo:8.0
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: mongo
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: catalog
spec:
  selector:
    app: dealership-catalog
  ports:
    - port: 3030
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-catalog
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership-catalog
  template:
    metadata:
      labels:
        app: dealership-catalog
    spec:
      containers:
        - name: catalog
          image: registry.example.com/ibm-fullstack/catalog:1
          env:
            - name: MONGODB_URI
              value: mongodb://dealership-mongo:27017
          ports:
            - name: http
              containerPort: 3030
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: sentiment
spec:
  selector:
    app: dealership-sentiment
  ports:
    - port: 5050
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-sentiment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dealership-sentiment
  template:
    metadata:
      labels:
        app: dealership-sentiment
    spec:
      containers:
        - name: sentiment
          image: registry.example.com/ibm-fullstack/sentiment:1
          ports:
            - name: http
              containerPort: 5050
          readinessProbe:
            httpGet:
              path: /health
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: dealership
spec:
  selector:
    app: dealership
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dealership
  template:
    metadata:
      labels:
        app: dealership
    spec:
      securityContext:
        fsGroup: 10001
      containers:
        - name: dealership
          image: registry.example.com/ibm-fullstack/dealership:1
          envFrom:
            - configMapRef:
                name: dealership-config
          env:
            - name: DJANGO_DEBUG
              value: "0"
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: dealership-secret
                  key: DJANGO_SECRET_KEY
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health
              port: http
              httpHeaders:
                - name: Host
                  value: "127.0.0.1"
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
